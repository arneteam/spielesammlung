<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Würfelpad">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#13302A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Würfelpad</title>
<style>
  :root{
    --ink:#1B2420; --ink-soft:#5B6660; --paper:#EEF1EA; --paper-2:#E1E6DA; --line:rgba(27,36,32,0.14);
    --font-display: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', monospace;
    --radius:14px;
  }
  @media (prefers-color-scheme: dark){ :root{ --paper:#1A221E; --paper-2:#212B25; --ink:#EBEEE8; --ink-soft:#93A098; --line:rgba(235,238,232,0.14); } }
  :root[data-theme="dark"]{ --paper:#1A221E; --paper-2:#212B25; --ink:#EBEEE8; --ink-soft:#93A098; --line:rgba(235,238,232,0.14); }
  :root[data-theme="light"]{ --paper:#EEF1EA; --paper-2:#E1E6DA; --ink:#1B2420; --ink-soft:#5B6660; --line:rgba(27,36,32,0.14); }

  /* ---- Per-game themes: each sets the "t-" tokens used by header/bottom bar/accents ---- */
  body.theme-kniffel, body.theme-extrem{
    --t-head-from:#1F4C3A; --t-head-to:#13302A; --t-accent:#C23B3B; --t-accent-ink:#FBF6EF;
    --t-gold:#9C7A1E; --t-card:var(--paper-2); --t-page:var(--paper); --t-ink:var(--ink); --t-ink-soft:var(--ink-soft);
    --t-display:var(--font-display); --t-tile-bg: linear-gradient(160deg,#1F4C3A,#13302A); --t-tile-ink:#FBF6EF;
  }
  @media (prefers-color-scheme: dark){
    body.theme-kniffel, body.theme-extrem{ --t-accent:#E2756F; --t-gold:#D9B65C; }
  }
  :root[data-theme="dark"] body.theme-kniffel, :root[data-theme="dark"] body.theme-extrem{ --t-accent:#E2756F; --t-gold:#D9B65C; }

  /* Qwixx and the Clever series commit to their real-product look (bright sheet / black box)
     rather than following the OS theme — pin the shared tokens so every component stays legible. */
  body.theme-qwixx{
    --paper:#F7F5EC; --paper-2:#EFEBDC; --ink:#1B2420; --ink-soft:#5B6660; --line:rgba(27,36,32,0.14);
    --t-head-from:#FFFFFF; --t-head-to:#F1EEE4; --t-accent:#C7342E; --t-accent-ink:#FFFFFF;
    --t-gold:#B8860E; --t-card:var(--paper-2); --t-page:var(--paper);
    --t-display:var(--font-body); --t-tile-bg:#FBFAF4; --t-tile-ink:#1B2420;
  }
  body.theme-gsc, body.theme-doppelt, body.theme-dreimal{
    --paper:#FBFAF5; --paper-2:#F4F2EA; --ink:#1B2420; --ink-soft:#5B6660; --line:rgba(27,36,32,0.14);
    --t-head-from:#15161B; --t-head-to:#07080A; --t-accent-ink:#F4F2EA;
    --t-card:#F4F2EA; --t-page:#121317;
    --t-display:var(--font-body); --t-tile-bg: linear-gradient(160deg,#17181D,#07080A); --t-tile-ink:#F4F2EA;
  }
  body.theme-gsc{ --t-accent:#39E0CE; --t-gold:#39E0CE; }
  body.theme-doppelt{ --t-accent:#F252B0; --t-gold:#F252B0; }
  body.theme-dreimal{ --t-accent:#F0C23E; --t-gold:#F0C23E; }

  /* Clever series: match the real pad — an outlined colour frame on the black board, not a filled bar */
  body.theme-gsc .card, body.theme-doppelt .card, body.theme-dreimal .card{
    background: rgba(244,242,234,0.035); border:2px solid var(--sec-color, rgba(244,242,234,0.22)); border-radius:16px;
  }
  body.theme-gsc .sec-head, body.theme-doppelt .sec-head, body.theme-dreimal .sec-head{
    background:transparent; color:var(--sec-color,#F4F2EA); padding:10px 14px 0; font-size:0.98rem; letter-spacing:0.02em;
  }
  body.theme-gsc .sec-head .ssub, body.theme-doppelt .sec-head .ssub, body.theme-dreimal .sec-head .ssub{ color:#F4F2EA; }
  body.theme-gsc .bonus-row, body.theme-doppelt .bonus-row, body.theme-gsc .subtotal, body.theme-doppelt .subtotal, body.theme-dreimal .subtotal{ background:transparent; }
  /* the card is now a dark outline frame, not a light sheet — flip the generic row/stepper/subtotal text to light */
  body.theme-gsc .row-label .name, body.theme-doppelt .row-label .name, body.theme-dreimal .row-label .name{ color:#F4F2EA; }
  body.theme-gsc .row-label .hint, body.theme-doppelt .row-label .hint, body.theme-dreimal .row-label .hint,
  body.theme-gsc .subtotal, body.theme-doppelt .subtotal, body.theme-dreimal .subtotal,
  body.theme-gsc .legend-line, body.theme-doppelt .legend-line, body.theme-dreimal .legend-line{ color:rgba(244,242,234,0.62); }
  body.theme-gsc .subtotal b, body.theme-doppelt .subtotal b, body.theme-dreimal .subtotal b{ color:#F4F2EA; }
  body.theme-gsc .stepper button, body.theme-doppelt .stepper button, body.theme-dreimal .stepper button{ border-color:rgba(244,242,234,0.3); color:#F4F2EA; background:transparent; }
  body.theme-gsc .stepper .count, body.theme-doppelt .stepper .count, body.theme-dreimal .stepper .count{ color:#F4F2EA; }
  body.theme-gsc .tracker-dice .tdie, body.theme-doppelt .tracker-dice .tdie, body.theme-dreimal .tracker-dice .tdie,
  body.theme-gsc .tracker-pips button, body.theme-doppelt .tracker-pips button, body.theme-dreimal .tracker-pips button{ background:transparent; border-color:rgba(244,242,234,0.35); }
  body.theme-gsc .tracker-pips button.on, body.theme-doppelt .tracker-pips button.on, body.theme-dreimal .tracker-pips button.on{ background:rgba(244,242,234,0.55); border-color:rgba(244,242,234,0.55); }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  body{
    background:var(--t-page, var(--paper)); color:var(--ink); font-family:var(--font-body);
    -webkit-tap-highlight-color:transparent; overscroll-behavior-y:contain;
    padding-bottom:calc(88px + env(safe-area-inset-bottom, 0px));
    padding-left:env(safe-area-inset-left, 0px); padding-right:env(safe-area-inset-right, 0px);
    transition: background .2s;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition-duration:0.001ms !important; animation-duration:0.001ms !important; } }
  /* iPhone: no double-tap zoom delay, no text selection / callout on long press while tapping cells */
  button{ font-family:inherit; touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .ptab, .tile, .gsc-cell{ touch-action:manipulation; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  button:focus-visible, input:focus-visible{ outline:2px solid var(--t-accent, #C23B3B); outline-offset:2px; }

  /* ---------- Header ---------- */
  header.app-top{
    position:sticky; top:0; z-index:20;
    background: linear-gradient(180deg, var(--t-head-from,#1F4C3A), var(--t-head-to,#13302A));
    color: var(--t-accent-ink, #FBF6EF);
    box-shadow: 0 3px 10px rgba(0,0,0,0.14);
    padding-top:env(safe-area-inset-top, 0px);
  }
  body.theme-gsc header.app-top{ box-shadow:0 0 18px rgba(57,224,206,0.25), 0 3px 10px rgba(0,0,0,0.5); }
  body.theme-doppelt header.app-top{ box-shadow:0 0 18px rgba(242,82,176,0.25), 0 3px 10px rgba(0,0,0,0.5); }
  body.theme-dreimal header.app-top{ box-shadow:0 0 18px rgba(240,194,62,0.25), 0 3px 10px rgba(0,0,0,0.5); }
  body.theme-qwixx header.app-top{ color:#1B2420; box-shadow:0 1px 0 var(--line), 0 3px 10px rgba(0,0,0,0.06); border-bottom:3px solid #C7342E; }

  .app-top-inner{ display:flex; align-items:center; gap:10px; padding:12px 16px 8px; }
  .back-btn{
    border:none; background:rgba(255,255,255,0.14); color:inherit; width:34px; height:34px; border-radius:9px;
    font-size:1.05rem; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  body.theme-qwixx .back-btn{ background:rgba(0,0,0,0.06); }
  .brand{ display:flex; align-items:center; gap:8px; font-family:var(--t-display,var(--font-display)); font-size:1.08rem; letter-spacing:0.01em; flex:1; min-width:0; }
  .brand .gname{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  body.theme-gsc .brand, body.theme-doppelt .brand, body.theme-dreimal .brand{
    text-transform:uppercase; font-weight:800; letter-spacing:0.06em; font-size:0.98rem;
    text-shadow: 0 0 10px var(--t-gold), 0 0 2px var(--t-gold);
  }

  .player-tabs{ display:flex; gap:8px; overflow-x:auto; padding:0 16px 12px; scrollbar-width:none; }
  .player-tabs::-webkit-scrollbar{display:none;}
  .ptab{
    flex:0 0 auto; display:flex; align-items:baseline; gap:6px; border:1px solid rgba(255,255,255,0.28);
    background:rgba(0,0,0,0.15); color:rgba(255,255,255,0.88); border-radius:999px; padding:7px 13px;
    font-size:0.86rem; cursor:pointer; white-space:nowrap; transition: background .15s, border-color .15s;
  }
  body.theme-qwixx .ptab{ border-color:rgba(0,0,0,0.18); background:rgba(0,0,0,0.04); color:rgba(27,36,32,0.8); }
  .ptab .tot{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:0.82rem; opacity:0.85; }
  .ptab.active{ background:var(--t-accent); border-color:var(--t-accent); color:var(--t-accent-ink); font-weight:700; }
  .ptab.leader:not(.active){ border-color:var(--t-gold); color:var(--t-gold); }
  .ptab.leader:not(.active) .tot{ color:var(--t-gold); opacity:1; }

  .toast{
    position:fixed; top:8px; left:50%; transform:translate(-50%,-14px); z-index:40;
    background:var(--t-accent,#C23B3B); color:var(--t-accent-ink,#fff); padding:9px 16px; border-radius:999px;
    font-size:0.86rem; font-weight:600; opacity:0; pointer-events:none; transition: opacity .2s, transform .2s;
    box-shadow:0 4px 14px rgba(0,0,0,0.25);
  }
  .toast.show{ opacity:1; transform:translate(-50%,0); }

  /* ---------- Picker ---------- */
  .picker{ max-width:640px; margin:0 auto; padding:28px 18px 40px; }
  .picker h1{ font-family:var(--font-display); font-size:1.6rem; margin:0 0 4px; text-wrap:balance; color:var(--ink); }
  .picker p.sub{ color:var(--ink-soft); margin:0 0 22px; font-size:0.92rem; }
  .tile-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:420px){ .tile-grid{ grid-template-columns:1fr; } }
  .tile{
    border:none; cursor:pointer; border-radius:16px; padding:18px 16px; text-align:left;
    display:flex; flex-direction:column; gap:10px; min-height:118px; position:relative; overflow:hidden;
  }
  .tile .tname{ font-size:1.08rem; font-weight:700; line-height:1.2; }
  .tile .tsub{ font-size:0.78rem; opacity:0.75; }
  .tile .tdots{ display:flex; gap:5px; margin-top:auto; }
  .tile .tdots span{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .tile.kniffel-fam{ background:linear-gradient(160deg,#1F4C3A,#13302A); color:#FBF6EF; }
  .tile.qwixx-fam{ background:#FBFAF4; color:#1B2420; border:1px solid var(--line); }
  .tile.clever-fam{ background:linear-gradient(160deg,#17181D,#07080A); color:#F4F2EA; }
  .tile.clever-fam .tname{ text-transform:uppercase; letter-spacing:0.05em; font-weight:800; }
  .tile.gsc .tname{ text-shadow:0 0 10px #39E0CE; }
  .tile.doppelt .tname{ text-shadow:0 0 10px #F252B0; }
  .tile.dreimal .tname{ text-shadow:0 0 10px #F0C23E; }

  /* ---------- Setup ---------- */
  .setup{ max-width:520px; margin:0 auto; padding:22px 18px 40px; }
  .setup h1{ font-family:var(--t-display,var(--font-display)); font-size:1.4rem; margin:0 0 4px; text-wrap:balance; color:var(--ink); }
  .setup p.sub{ color:var(--ink-soft); margin:0 0 20px; font-size:0.9rem; }
  .player-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .player-row input{ flex:1; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); border-radius:10px; padding:11px 12px; font-size:1rem; }
  .icon-btn{ border:1px solid var(--line); background:transparent; color:var(--ink-soft); width:38px; height:38px; border-radius:10px; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .add-player{ width:100%; margin-top:4px; padding:12px; border-radius:10px; border:1px dashed var(--line); background:transparent; color:var(--ink-soft); font-size:0.92rem; cursor:pointer; }
  .ruleset-note{ margin-top:20px; padding:14px 16px; border-radius:var(--radius); background:var(--paper-2); border:1px solid var(--line); font-size:0.85rem; color:var(--ink-soft); }
  .ruleset-note b{ color:var(--ink); }
  .start-btn{ width:100%; margin-top:22px; padding:15px; border-radius:12px; border:none; background:var(--t-accent,#C23B3B); color:var(--t-accent-ink,#fff); font-size:1.05rem; font-weight:700; cursor:pointer; }
  .start-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  /* ---------- Sheet shared ---------- */
  main.sheet{ max-width:580px; margin:0 auto; padding:14px 14px 20px; }
  .info-line{ font-size:0.78rem; color: color-mix(in srgb, var(--t-accent-ink,#fff) 55%, transparent); margin:0 4px 12px; }
  body.theme-qwixx .info-line, body.theme-kniffel .info-line, body.theme-extrem .info-line{ color:var(--ink-soft); }
  .section-label{ text-transform:uppercase; font-size:0.72rem; letter-spacing:0.09em; color:var(--ink-soft); font-weight:700; margin:18px 4px 6px; }
  .section-label:first-child{ margin-top:4px; }
  .card{ background:var(--t-card,var(--paper-2)); border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); margin-bottom:14px; }
  .sec-head{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; color:#fff; font-weight:700; font-size:0.92rem; }
  .sec-head .ssub{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-weight:700; font-size:0.92rem; }
  .row{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-bottom:1px solid var(--line); }
  .row:last-child{ border-bottom:none; }
  .row-label{ flex:1; min-width:0; }
  .row-label .name{ font-size:0.96rem; font-weight:600; }
  .row-label .hint{ font-size:0.74rem; color:var(--ink-soft); margin-top:1px; }
  .num-input{ width:4.4rem; text-align:right; border:none; border-bottom:2px solid var(--line); background:transparent; color:var(--ink); font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:1.08rem; padding:4px 2px; }
  .num-input:focus{ border-bottom-color:var(--t-accent,#C23B3B); outline:none; }
  .num-input::placeholder{ color:var(--ink-soft); opacity:0.5; }
  .fixed-choice{ display:flex; gap:6px; flex:0 0 auto; }
  .fixed-choice button{ border-radius:999px; border:1px solid var(--line); background:transparent; color:var(--ink-soft); font-family:var(--font-mono); font-size:0.9rem; min-width:44px; min-height:38px; padding:6px 12px; cursor:pointer; font-variant-numeric:tabular-nums; }
  .fixed-choice button.yes.on{ background:var(--t-accent,#C23B3B); color:var(--t-accent-ink,#fff); border-color:var(--t-accent,#C23B3B); font-weight:700; }
  .fixed-choice button.no.on{ background:var(--ink-soft); color:var(--paper); border-color:var(--ink-soft); }
  .bonus-row{ background:linear-gradient(90deg, rgba(156,122,30,0.08), transparent); padding:11px 14px; display:flex; justify-content:space-between; align-items:center; font-size:0.82rem; color:var(--ink-soft); border-top:1px solid var(--line); }
  .bonus-row .val{ font-family:var(--font-mono); font-variant-numeric:tabular-nums; color:var(--t-gold,#9C7A1E); font-weight:700; }
  .kbonus-row{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-top:1px solid var(--line); }
  .kbonus-row .row-label .name{ font-size:0.88rem; }
  .stepper{ display:flex; align-items:center; gap:10px; flex:0 0 auto; }
  .stepper button{ width:38px; height:38px; border-radius:8px; border:1px solid var(--line); background:transparent; color:var(--ink); font-size:1rem; cursor:pointer; }
  .stepper button:disabled{ opacity:0.3; cursor:not-allowed; }
  .stepper .count{ font-family:var(--font-mono); min-width:1.4em; text-align:center; font-variant-numeric:tabular-nums; }
  .subtotal{ display:flex; justify-content:space-between; padding:12px 14px; font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:0.9rem; color:var(--ink-soft); background:var(--paper); border-top:1px solid var(--line); }
  .subtotal b{ color:var(--ink); font-size:0.98rem; }

  /* ---------- Clever-engine: authentic sheet-style cells ---------- */
  .legend-line{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:8px 14px 2px; font-size:0.72rem; color:var(--ink-soft); }

  /* crossed-off look shared by grid / scale / sum cells: number stays, a pen-stroke crosses it out */
  .xcell{ position:relative; }
  .xcell.on::after{ content:''; position:absolute; left:14%; right:14%; top:49%; height:2px; background:currentColor; transform:rotate(-16deg); border-radius:2px; }

  .grid-wrap{ padding:10px 10px 2px; display:flex; flex-direction:column; gap:3px; }
  .grid-row{ display:flex; gap:3px; align-items:center; }
  .grid-row .rlabel{ min-width:2.8em; margin-right:2px; font-size:0.68rem; color:var(--ink-soft); flex:0 0 auto; white-space:nowrap; }
  .gcell{ width:32px; height:32px; border-radius:5px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-family:var(--font-mono); font-size:0.86rem; display:flex; align-items:center; justify-content:center; cursor:pointer; flex:0 0 auto; }
  .gcell.on{ background:color-mix(in srgb, var(--sec-color,var(--t-accent)) 78%, var(--paper)); color:var(--ink); border-color:var(--sec-color,var(--t-accent)); font-weight:700; }
  .gcell.wild{ font-style:italic; }
  .grid-rowbonus{ flex:0 0 auto; margin-left:4px; }
  .grid-colvals{ display:flex; gap:3px; padding:4px 0 2px; }
  .grid-colvals .colcell{ width:32px; display:flex; flex-direction:column; align-items:center; gap:2px; }
  .grid-colvals span{ font-size:0.64rem; color:var(--ink-soft); font-family:var(--font-mono); }

  .cellstrip{ display:flex; gap:4px; overflow-x:auto; padding:12px 14px; align-items:flex-end; }
  .scell{ flex:0 0 auto; min-width:38px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .scell button{ width:36px; height:36px; border-radius:7px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-family:var(--font-mono); font-size:0.82rem; cursor:pointer; }
  .scell button.on{ background:color-mix(in srgb, var(--sec-color,var(--t-accent)) 78%, var(--paper)); color:var(--ink); border-color:var(--sec-color,var(--t-accent)); font-weight:700; }
  .scell .slabel{ font-size:0.64rem; color:var(--ink-soft); font-family:var(--font-mono); white-space:nowrap; }

  .sumcell{ flex:0 0 auto; min-width:38px; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .sumcell input{ width:38px; height:36px; text-align:center; border-radius:7px; border:1px solid var(--line); background:var(--paper); color:var(--ink); font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-size:16px; padding:0 2px; }
  .sumcell input:focus{ border-color:var(--t-accent,#C23B3B); outline:none; }
  .sumcell .shint{ font-size:0.64rem; color:var(--ink-soft); font-family:var(--font-mono); white-space:nowrap; }

  .net-wrap{ display:flex; flex-wrap:wrap; gap:7px; padding:12px 14px; }
  .ncell{ width:38px; height:38px; border-radius:50%; border:2px solid var(--line); background:var(--paper); color:var(--ink); font-family:var(--font-mono); font-size:0.84rem; cursor:pointer; display:flex; align-items:center; justify-content:center; position:relative; }
  .ncell.circled{ border-color:var(--sec-color,var(--t-gold,#9C7A1E)); color:var(--sec-color,var(--t-gold,#9C7A1E)); font-weight:700; }
  .ncell.crossed{ background:color-mix(in srgb, var(--sec-color,var(--t-accent)) 78%, var(--paper)); border-color:var(--sec-color,var(--t-accent)); color:var(--ink); font-weight:700; }
  .ncell.crossed::after{ content:''; position:absolute; left:16%; right:16%; top:49%; height:2px; background:currentColor; transform:rotate(-16deg); border-radius:2px; }

  .nline-wrap{ display:flex; gap:4px; overflow-x:auto; padding:12px 14px; }
  .nline-cell{ flex:0 0 auto; width:40px; display:flex; flex-direction:column; align-items:center; gap:4px; }

  function blankSection(sec){
    switch(sec.type){
      case 'grid': return { cells: sec.rows.map(function(r){ return r.map(function(){ return false; }); }) };
      case 'scale': return { crossed: sec.values.map(function(){ return false; }) };
      case 'sum': return { values: new Array(sec.count).fill(null) };
      case 'pairsub': return { pairs: new Array(sec.count).fill(null).map(function(){ return [null,null]; }) };
      case 'network': return { state: sec.nodes.map(function(){ return 0; }) };
      case 'numberline': var v = new Array(13).fill(null); v[6] = 7; return { values:v };
    }
  }

  function freshScoresFor(gameKey){

        orange:new Array(11).fill(null), lila:new Array(11).fill(null), used:{ reroll:0, plus:0 } };
    }
    if(def.family === 'kniffel') return { upper:{}, lower:{}, kniffelBonusCount:0 };
    if(def.family === 'qwixx'){
      var rows = {}; def.rows.forEach(function(r){ rows[r.key] = { crossed:new Array(11).fill(false), locked:false }; });
      return { rows:rows, penalty:0 };
    }
    if(def.family === 'clever'){
      var sections = {}; def.sections.forEach(function(sec){ sections[sec.key] = blankSection(sec); });
      var trackers = {}; (def.trackers||[]).forEach(function(t){ trackers[t.key] = new Array(6).fill(false); });
      return { sections:sections, fox:0, trackers:trackers };
    }
  }

  // ---------- Scoring ----------
  function computeKniffelTotals(player, gameKey){
    var def = GAMES[gameKey], sc = player.scores, upperSum = 0;
    def.upper.forEach(function(c){ var v = sc.upper[c.key]; if(typeof v==='number') upperSum += v; });
    var bonus = upperSum >= def.bonusThreshold ? def.bonusValue : 0;
    var upperTotal = upperSum + bonus, lowerSum = 0;
    def.lower.forEach(function(c){ var v = sc.lower[c.key]; if(typeof v==='number') lowerSum += v; });
    var kniffelBonus = (sc.kniffelBonusCount||0) * def.kniffelBonusPerExtra;
    lowerSum += kniffelBonus;
    return { upperSum:upperSum, bonus:bonus, upperTotal:upperTotal, lowerSum:lowerSum, kniffelBonus:kniffelBonus, grand:upperTotal+lowerSum };
  }

  function computeQwixxTotals(player){
    var def = GAMES.qwixx, sc = player.scores, rowScores = {}, sum = 0;
    def.rows.forEach(function(r){
      var rd = sc.rows[r.key], cnt = rd.crossed.filter(Boolean).length + (rd.locked ? 1 : 0);
      var s = cnt > 0 ? (def.table[cnt-1]||def.table[def.table.length-1]) : 0;
      rowScores[r.key] = s; sum += s;
    });
    var penaltyScore = (sc.penalty||0) * def.penaltyValue;
    return { rowScores:rowScores, penaltyScore:penaltyScore, grand: sum - penaltyScore };
  }

  function scoreSection(sec, data){
    switch(sec.type){
      case 'grid':
        if(sec.gridScoring.mode === 'columnvalues'){
          var total = 0, cols = sec.rows[0].length;
          for(var c=0;c<cols;c++){ var allOn = true; for(var r=0;r<sec.rows.length;r++){ if(!data.cells[r][c]) allOn=false; } if(allOn) total += sec.gridScoring.values[c]; }
          return total;
        } else {
          var t = 0;
          sec.rows.forEach(function(row,r){ var cnt = data.cells[r].filter(Boolean).length; if(cnt>0) t += sec.gridScoring.table[cnt-1]; });
          return t;
        }
      case 'scale': { var cnt = data.crossed.filter(Boolean).length; return cnt>0 ? sec.table[cnt-1] : 0; }
      case 'sum': return data.values.reduce(function(a,v){ return a + (typeof v==='number'?v:0); }, 0);
      case 'pairsub': return data.pairs.reduce(function(a,p){ return a + ((typeof p[0]==='number'?p[0]:0) - (typeof p[1]==='number'?p[1]:0)); }, 0);
      case 'network': { var cnt2 = data.state.filter(function(s){ return s===2; }).length; return cnt2>0 ? sec.table[cnt2-1] : 0; }
      case 'numberline': {
        var STARS = [22,17,13,9,6,3,0,3,6,9,13,17,22];
        var filled = []; data.values.forEach(function(v,i){ if(typeof v==='number') filled.push(i); });
        if(!filled.length) return 0;
        var minI = Math.min.apply(null,filled), maxI = Math.max.apply(null,filled);
        var bonus = 0;
        data.values.forEach(function(v,i){ if(i===6) return; if(typeof v==='number' && (v<=4 || v>=10)) bonus += 4; });
        return STARS[minI] + STARS[maxI] + bonus;
      }
    }
    return 0;
  }

  function computeCleverTotals(player, gameKey){
    var def = GAMES[gameKey], sc = player.scores, breakdown = {};
    def.sections.forEach(function(sec){ breakdown[sec.key] = scoreSection(sec, sc.sections[sec.key]); });
    var nonFox = def.sections.map(function(sec){ return breakdown[sec.key]; });
    var hasZero = nonFox.some(function(v){ return v===0; });
    var foxCount = sc.fox||0;
    var foxScore = (foxCount>0 && !hasZero) ? foxCount * Math.min.apply(null,nonFox) : 0;
    var sum = nonFox.reduce(function(a,b){ return a+b; }, 0);
    return { breakdown:breakdown, foxScore:foxScore, grand: sum + foxScore };
  }

  // ---------- Ganz schön clever (pad layout) ----------
  function gscMaxRounds(){ var n = state.players.length; return n<=2 ? 6 : (n===3 ? 5 : 4); }

  // every bonus the player has unlocked so far, with a stable id per printed bonus spot
  function gscBonuses(def, sc){
    var out = [], round = state.gscRound || 1;
    function add(id, spec){ if(spec) out.push({ id:id, spec:spec }); }
    def.rounds.forEach(function(spec, i){ if(i < round) add('r'+i, spec); });
    var Y = def.yellow;
    sc.yellow.forEach(function(row, r){ if(row.every(Boolean)) add('yr'+r, Y.rowBonus[r]); });
    if(sc.yellow.every(function(row, i){ return row[i]; })) add('yd', Y.diagBonus);
    var B = def.blue;
    function blueOn(v){ return v===null || sc.blue[v-2]; }
    B.rows.forEach(function(row, r){ if(row.every(blueOn)) add('br'+r, B.rowBonus[r]); });
    B.rows[0].forEach(function(_, c){ if(B.rows.every(function(row){ return blueOn(row[c]); })) add('bc'+c, B.colBonus[c]); });
    var gCount = sc.green.filter(Boolean).length;
    Object.keys(def.green.bonus).forEach(function(i){ if(gCount > +i) add('g'+i, def.green.bonus[i]); });
    ['orange','lila'].forEach(function(k){
      var filled = sc[k].filter(function(v){ return v!==null; }).length;
      Object.keys(def[k].bonus).forEach(function(i){ if(filled > +i) add(k.charAt(0)+i, def[k].bonus[i]); });
    });
    return out;
  }

  function computeGscTotals(player){
    var def = GAMES.gsc, sc = player.scores;
    var blueCount = sc.blue.filter(Boolean).length, greenCount = sc.green.filter(Boolean).length;
    var parts = {
      gelb: def.yellow.colPoints.reduce(function(a, p, c){ return a + (sc.yellow.every(function(row){ return row[c]; }) ? p : 0); }, 0),
      blau: blueCount ? def.blue.table[blueCount-1] : 0,
      gruen: greenCount ? def.green.table[greenCount-1] : 0,
      orange: sc.orange.reduce(function(a, v, i){ return a + (v===null ? 0 : v*def.orange.mult[i]); }, 0),
      lila: sc.lila.reduce(function(a, v){ return a + (v===null ? 0 : v); }, 0)
    };
    var bonuses = gscBonuses(def, sc);
    function countKind(k){ return bonuses.filter(function(b){ return b.spec.kind===k; }).length; }
    var vals = def.sections.map(function(s){ return parts[s.key]; });
    var foxMin = Math.min.apply(null, vals), fox = countKind('fox');
    var foxScore = fox * foxMin;
    return { parts:parts, blueCount:blueCount, greenCount:greenCount, bonuses:bonuses, fox:fox, foxMin:foxMin, foxScore:foxScore,
      earned:{ reroll:countKind('reroll'), plus:countKind('plus') },
      grand: vals.reduce(function(a, b){ return a+b; }, 0) + foxScore };
  }

  function getGrandTotal(player, gameKey){
    if(GAMES[gameKey].layout==='gsc') return computeGscTotals(player).grand;
    var fam = GAMES[gameKey].family;
    if(fam==='kniffel') return computeKniffelTotals(player, gameKey).grand;
    if(fam==='qwixx') return computeQwixxTotals(player).grand;
    if(fam==='clever') return computeCleverTotals(player, gameKey).grand;
    return 0;
  }

  // ---------- Turn advance ----------
  function isKniffelPlayerDone(player, gameKey){
    var def = GAMES[gameKey], sc = player.scores;
    return def.upper.every(function(c){ return sc.upper[c.key] !== undefined && sc.upper[c.key] !== null; }) &&
           def.lower.every(function(c){ return sc.lower[c.key] !== undefined && sc.lower[c.key] !== null; });
  }
  function advanceSequential(){
    if(state.players.length <= 1) return;
    var n = state.players.length, start = state.activePlayerIndex;
    for(var step=1; step<=n; step++){
      var idx = (start+step) % n;
      if(!isKniffelPlayerDone(state.players[idx], state.game)){
        state.activePlayerIndex = idx;
        showToast('Weiter: ' + state.players[idx].name);
        return;
      }
    }
  }
  function advanceRoundRobin(){
    state.tray = emptyTray();
    if(state.players.length <= 1) return;
    state.activePlayerIndex = (state.activePlayerIndex+1) % state.players.length;
    var name = state.players[state.activePlayerIndex].name;
    // Clever pad: wrapping back to the first player starts the next round
    if(GAMES[state.game].layout==='gsc' && state.activePlayerIndex===0){
      if((state.gscRound||1) < gscMaxRounds()){ state.gscRound = (state.gscRound||1) + 1; showToast('Runde ' + state.gscRound + ' · ' + name, 2200); }
      else showToast('Letzte Runde gespielt – Übersicht ansehen', 2600);
      return;
    }
    showToast('Weiter: ' + name);
  }

  function buildFixedRow(cat, sc, onChange){

    yes.addEventListener('click', function(){

    });
    var no = document.createElement('button'); no.className = 'no'+(current===0?' on':''); no.textContent = '0';

  var ACTION_ICON = { '+1':'plus', 'Rückhol':'retrieve', 'Joker':'swap' };
  function badgeChip(spec, def){
    if(!spec) return null;
    var el = document.createElement('span'); el.className = 'bchip bchip-'+spec.kind;
    if(spec.kind==='ask' || spec.kind==='write'){
      var target = def.sections.filter(function(s){ return s.key===spec.target; })[0];
      var tColor = target ? target.color : '#999';
      var tLabel = target ? target.label : spec.target;
      el.style.background = tColor;
      el.textContent = spec.kind==='write' ? ('+'+spec.value) : '?';
      el.title = spec.kind==='write' ? ('Schreibe '+spec.value+' in '+tLabel) : ('Bonus: freie Eingabe in '+tLabel);
    } else if(spec.kind==='action'){
      el.innerHTML = ICON_SVG[ACTION_ICON[spec.label] || 'plus'];
      el.title = spec.label || 'Sonderaktion';
    } else if(spec.kind==='fox'){
      el.style.setProperty('--bchip-bg', '#A05B3A');
      el.innerHTML = ICON_SVG.fox;
      el.title = 'Fuchs';
    } else {
      el.innerHTML = ICON_SVG.reroll;
      el.title = 'Nochmal würfeln';
    }
    return el;
  }

          var b = document.createElement('input'); b.type='number'; b.inputMode='numeric'; b.placeholder='–';
          b.value = typeof data.pairs[p][1]==='number' ? data.pairs[p][1] : '';
          b.addEventListener('change', function(){ data.pairs[p][1] = b.value===''?null:Math.max(0,parseInt(b.value,10)||0); onChange(); });
          boxes.appendChild(a); boxes.appendChild(minus); boxes.appendChild(b);
          group.appendChild(hint); group.appendChild(boxes); pw.appendChild(group);
        })(p);
      }
      card.appendChild(pw);
      renderLegend(sec, def, card);
    } else if(sec.type==='network'){
      var nw = document.createElement('div'); nw.className='net-wrap';
      sec.nodes.forEach(function(v,i){
        var st = data.state[i];
        var cell = document.createElement('button');
        cell.className = 'ncell' + (st===1?' circled':'') + (st===2?' crossed':'');
        cell.textContent = v;
        cell.addEventListener('click', function(){ data.state[i] = (st+1)%3; onChange(); });
        nw.appendChild(cell);
      });
      card.appendChild(nw);
      var legend2 = document.createElement('div'); legend2.className='legend-line';
      legend2.textContent = 'Tippen: leer → eingekreist → gekreuzt. Nur Gekreuztes zählt.';
      card.appendChild(legend2);
      renderLegend(sec, def, card);
    } else if(sec.type==='numberline'){
      var nl = document.createElement('div'); nl.className='nline-wrap';
      var STARS = [22,17,13,9,6,3,0,3,6,9,13,17,22];
      for(var i=0;i<13;i++){
        (function(i){
          var cell = document.createElement('div'); cell.className='nline-cell';
          var input = document.createElement('input'); input.type='number'; input.inputMode='numeric';
          if(i===6){ input.value = 7; input.disabled = true; }
          else {
            var v = data.values[i]; input.value = typeof v==='number' ? v : '';
            input.addEventListener('change', function(){ data.values[i] = input.value===''?null:(parseInt(input.value,10)||0); onChange(); });
          }
          var star = document.createElement('div'); star.className='star'; star.textContent = '★'+STARS[i];
          cell.appendChild(input); cell.appendChild(star); nl.appendChild(cell);
        })(i);
      }
      card.appendChild(nl);
      renderLegend(sec, def, card);
    }
    return card;
  }

  function renderCleverSheet(def, player, sc){

    var foxCard = document.createElement('div'); foxCard.className = 'card';

    var label = document.createElement('div'); label.className = 'row-label';

    var stepper = document.createElement('div'); stepper.className = 'stepper';

    minus.addEventListener('click', function(){ sc.fox = Math.max(0,(sc.fox||0)-1); onChange(); });
    var count = document.createElement('span'); count.className='count'; count.textContent = sc.fox||0;
    var plus = document.createElement('button'); plus.textContent='+';
    plus.addEventListener('click', function(){ sc.fox = (sc.fox||0)+1; onChange(); });
    stepper.appendChild(minus); stepper.appendChild(count); stepper.appendChild(plus);
    foxRow.appendChild(label); foxRow.appendChild(stepper);
    foxCard.appendChild(foxRow);
    sheetView.appendChild(foxCard);

    var totals = computeCleverTotals(player, state.game);
    var sumCard = document.createElement('div'); sumCard.className = 'card';
    var sub = document.createElement('div'); sub.className = 'subtotal';
    sub.innerHTML = '<span>Fuchs-Punkte</span><b>'+totals.foxScore+'</b>';
    sumCard.appendChild(sub);

    bbTotal.textContent = totals.grand;

  // ===================================================================
  // Dice tray (Clever series): chosen dice lie on the sheet, the rest on the silver platter.
  // The dice are physical and shared, so the tray belongs to the turn, not to a player.
  // ===================================================================
  function emptyTray(){ return { chosen:[], platter:[] }; }
  function trayDice(def){
    return [{ key:'weiss', label:'Weiß', color:'#F4F2EA' }].concat(def.sections.map(function(s){ return { key:s.key, label:s.label, color:s.color }; }));
  }
  function renderDiceTray(def){
    var tray = state.tray || (state.tray = emptyTray());
    var dice = trayDice(def);
    function info(k){ return dice.filter(function(d){ return d.key===k; })[0]; }
    function change(){ save(); renderAll(); }
    function dieEl(d, v, big){
      var b = document.createElement('button'); b.className = 'die' + (big ? ' big' : '') + (v ? '' : ' blank');
      b.style.setProperty('--dc', d.color);
      if(v) b.innerHTML = pipSVG(v, big ? 40 : 34, '#121317');
      b.setAttribute('aria-label', d.label + (v ? ' ' + v : ''));
      return b;
    }
    var used = tray.chosen.map(function(c){ return c.k; }).concat(tray.platter);
    var cup = dice.filter(function(d){ return used.indexOf(d.key) < 0; });

    var el = document.createElement('div'); el.className = 'tray';
    var head = document.createElement('div'); head.className = 'tray-head';
    head.innerHTML = '<span class="t">Würfel · ' + escapeHtml(state.players[state.activePlayerIndex].name) + '</span>';
    var reset = document.createElement('button'); reset.textContent = 'Alle zurück in den Becher';
    reset.addEventListener('click', function(){ state.tray = emptyTray(); change(); });
    head.appendChild(reset);
    el.appendChild(head);

    var slots = document.createElement('div'); slots.className = 'tray-slots';
    for(var i=0; i<3; i++){
      (function(i){
        var s = document.createElement('div'); s.className = 'tray-slot';
        var c = tray.chosen[i];
        if(c){
          var b = dieEl(info(c.k), c.v, true);
          b.title = 'Zurück in den Becher';
          b.addEventListener('click', function(){ tray.chosen.splice(i, 1); change(); });
          s.appendChild(b);
        } else {
          var ph = document.createElement('div'); ph.className = 'ph'; ph.textContent = 'frei'; s.appendChild(ph);
        }
        var cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = (i+1) + '. Wurf';
        s.appendChild(cap);
        slots.appendChild(s);
      })(i);
    }
    el.appendChild(slots);

    function row(cls, label, list, emptyText, onTap){
      var r = document.createElement('div'); r.className = 'tray-row ' + cls;
      r.innerHTML = '<div class="lbl">' + label + '</div>';
      var wrap = document.createElement('div'); wrap.className = 'dice';
      if(!list.length) wrap.innerHTML = '<span class="none">' + emptyText + '</span>';
      list.forEach(function(d){ var b = dieEl(d, null, false); b.addEventListener('click', function(){ onTap(d); }); wrap.appendChild(b); });
      r.appendChild(wrap);
      el.appendChild(r);
    }
    row('platter', 'Silber&shy;tablett', tray.platter.map(info), 'leer', function(d){
      tray.platter.splice(tray.platter.indexOf(d.key), 1); change();
    });
    row('cup', 'Im Becher', cup, 'alle Würfel liegen', function(d){
      var full = tray.chosen.length >= 3;
      openDiePicker('Würfel ' + d.label,
        full ? 'Du hast schon 3 Würfel gewählt – nur noch aufs Silbertablett.' : 'Welche Augenzahl zeigt er? Dann liegt er auf deinem Blatt.',
        function(){ return !full; },
        { label:'Aufs Silbertablett legen', fn:function(){ tray.platter.push(d.key); change(); } },
        function(v){
          tray.chosen.push({ k:d.key, v:v }); change();
          if(cup.length > 1) showToast('Würfel mit weniger Augen aufs Silbertablett', 2200);
        });
    });
    var hint = document.createElement('div'); hint.className = 'tray-hint';
    hint.textContent = 'Würfel im Becher antippen. Gewählte Würfel liegen auf dem Blatt, kleinere kommen aufs Silbertablett. Bei „Weiter“ geht alles zurück in den Becher.';
    el.appendChild(hint);
    return el;
  }

  // ===================================================================
  // Ganz schön clever sheet — same arrangement as the paper pad, own glyphs
  // ===================================================================
  var XPATH = '<path d="M5 5.5L19 18.5M18.5 5L5.5 19" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" fill="none"/>';
  var XMARK = '<svg class="gx" viewBox="0 0 24 24" aria-hidden="true">' + XPATH + '</svg>';
  var DUO_ICON = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="2.5" width="12" height="12" rx="2.5" fill="#3B8FE0" stroke="#F4F2EA" stroke-width="1"/><rect x="9.5" y="9.5" width="12" height="12" rx="2.5" fill="#F4F2EA"/></svg>';

  function gscSection(def, key){ return def.sections.filter(function(s){ return s.key===key; })[0]; }
  function gscBonusText(def, spec){
    switch(spec.kind){
      case 'reroll': return 'Neuwurf';
      case 'plus': return '+1-Aktion';
      case 'fox': return 'Fuchs';
      case 'any': return 'Kreuz/Zahl in beliebiger Farbe';
      case 'ask': return 'Kreuz in ' + gscSection(def, spec.target).label;
      case 'write': return spec.value + ' in ' + gscSection(def, spec.target).label + ' eintragen';
    }
    return '';
  }
  function gscChip(def, spec, got){
    var el = document.createElement('span'); el.className = 'gchip gchip-' + spec.kind + (got ? ' got' : '');
    if(spec.kind==='ask'){ el.classList.add('sq'); el.style.background = gscSection(def, spec.target).color; el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + XPATH + '</svg>'; }
    else if(spec.kind==='write'){ el.classList.add('sq'); el.style.background = gscSection(def, spec.target).color; el.textContent = spec.value; }
    else if(spec.kind==='any'){ el.classList.add('sq'); el.textContent = '?'; }
    else if(spec.kind==='plus'){ el.textContent = '+1'; }
    else if(spec.kind==='fox'){ el.style.setProperty('--bchip-bg', '#A05B3A'); el.innerHTML = ICON_SVG.fox; }
    else { el.innerHTML = ICON_SVG.reroll; }
    el.title = gscBonusText(def, spec) + (got ? ' (erreicht)' : '');
    return el;
  }

  function renderGscSheet(def, player, sc){
    var tot = computeGscTotals(player);
    var gotIds = tot.bonuses.map(function(b){ return b.id; });
    function got(id){ return gotIds.indexOf(id) >= 0; }
    function slot(id, spec){
      var s = document.createElement('div'); s.className = 'gsc-slot';
      if(spec) s.appendChild(gscChip(def, spec, got(id)));
      return s;
    }
    // apply a change, then announce any bonus it newly unlocked
    function commit(fn){
      fn();
      var fresh = gscBonuses(def, sc).filter(function(b){ return gotIds.indexOf(b.id) < 0; });
      if(fresh.length) showToast('Bonus: ' + fresh.map(function(b){ return gscBonusText(def, b.spec); }).join(' · '), 2600);
      save(); renderAll();
    }
    function area(key, title, pts, rule){
      var el = document.createElement('div'); el.className = 'gsc-area' + (key ? '' : ' neutral');
      if(key) el.style.setProperty('--a', gscSection(def, key).color);
      var head = document.createElement('div'); head.className = 'gsc-head';
      head.innerHTML = '<span class="t">' + escapeHtml(title) + '</span>' + (rule ? '<span class="rule">' + escapeHtml(rule) + '</span>' : '') +
        (pts !== null ? '<span class="pts">' + pts + '</span>' : '');
      el.appendChild(head);
      return el;
    }
    function cellBtn(text, on){
      var b = document.createElement('button'); b.className = 'gsc-cell'; b.textContent = text;
      if(on){ b.classList.add('on'); b.insertAdjacentHTML('beforeend', XMARK); }
      return b;
    }
    function sub(text, hit){ var s = document.createElement('div'); s.className = 'gsc-sub' + (hit ? ' hit' : ''); s.textContent = text; return s; }

    var board = document.createElement('div'); board.className = 'gsc-board';

    // ---- top: round track, reroll / +1 tracks, symbol key ----
    var round = state.gscRound || 1, maxR = gscMaxRounds();
    var top = area(null, 'Runde ' + round + '/' + maxR, null, state.players.length + ' Spieler');
    // the 3 chosen dice lie top-left on the pad; they belong to the turn and clear on "Weiter"
    var tray = state.tray || (state.tray = emptyTray());
    var trayList = trayDice(def);
    var dslots = document.createElement('div'); dslots.className = 'gsc-dslots';
    for(var di=0; di<3; di++){
      (function(i){
        var c = tray.chosen[i], b;
        if(c){
          var d = trayList.filter(function(x){ return x.key===c.k; })[0];
          b = document.createElement('button'); b.className = 'die gsc-dslot';
          b.style.setProperty('--dc', d.color); b.innerHTML = pipSVG(c.v, 30, '#121317');
          b.setAttribute('aria-label', d.label + ' ' + c.v + ' – antippen zum Entfernen');
          b.addEventListener('click', function(){ tray.chosen.splice(i, 1); save(); renderAll(); });
        } else {
          b = document.createElement('button'); b.className = 'gsc-dslot empty'; b.textContent = (i+1) + '.';
          b.setAttribute('aria-label', (i+1) + '. Würfel ablegen');
          b.addEventListener('click', function(){
            var free = trayList.filter(function(x){ return !tray.chosen.some(function(t){ return t.k===x.key; }); });
            openColorPicker('Welchen Würfel legst du ab?', 'Farbe wählen, dann die Augenzahl.', free, function(d){
              openDiePicker('Würfel ' + d.label, 'Welche Augenzahl zeigt er?', function(){ return true; }, null, function(v){
                tray.chosen.push({ k:d.key, v:v }); save(); renderAll();
              });
            });
          });
        }
        dslots.appendChild(b);
      })(di);
    }
    top.firstChild.insertBefore(dslots, top.firstChild.firstChild);
    var rounds = document.createElement('div'); rounds.className = 'gsc-rounds';
    def.rounds.forEach(function(spec, i){
      var col = document.createElement('div'); col.className = 'gsc-round';
      var b = document.createElement('button'); b.textContent = i+1;
      b.className = i+1 > maxR ? 'off' : (i+1===round ? 'cur' : (i+1 < round ? 'past' : ''));
      b.addEventListener('click', function(){
        if(i+1 > maxR){ showToast('Bei ' + state.players.length + ' Spielern nur ' + maxR + ' Runden'); return; }
        commit(function(){ state.gscRound = i+1; });
      });
      col.appendChild(b); col.appendChild(slot('r'+i, spec));
      rounds.appendChild(col);
    });
    top.appendChild(rounds);
    [{k:'reroll', label:'Neuwurf'}, {k:'plus', label:'+1-Aktion'}].forEach(function(t){
      var earned = tot.earned[t.k], used = Math.min(sc.used[t.k] || 0, earned);
      var row = document.createElement('div'); row.className = 'gsc-trk';
      var lbl = document.createElement('div'); lbl.className = 'lbl';
      lbl.appendChild(gscChip(def, {kind:t.k}, true)); lbl.appendChild(document.createTextNode((earned - used) + ' frei'));
      lbl.title = t.label;
      row.appendChild(lbl);
      var slots = document.createElement('div'); slots.className = 'slots';
      for(var i=0; i<Math.max(7, earned); i++){
        (function(i){
          var b = document.createElement('button');
          b.className = i < used ? 'used' : (i < earned ? 'earned' : '');
          if(i < used) b.innerHTML = XMARK;
          b.setAttribute('aria-label', t.label + ' ' + (i+1));
          b.addEventListener('click', function(){
            if(i >= earned){ showToast('Noch nicht freigeschaltet'); return; }
            commit(function(){ sc.used[t.k] = i < used ? i : i+1; });
          });
          slots.appendChild(b);
        })(i);
      }
      row.appendChild(slots);
      top.appendChild(row);
    });
    var legend = document.createElement('div'); legend.className = 'gsc-legend';
    [[{kind:'ask', target:'blau'}, 'Kreuz in der Farbe'], [{kind:'write', target:'orange', value:4}, 'Zahl eintragen'],
     [{kind:'reroll'}, 'Neuwurf'], [{kind:'plus'}, '+1-Aktion'], [{kind:'fox'}, 'Fuchs']].forEach(function(e){
      var s = document.createElement('span'); s.appendChild(gscChip(def, e[0], true)); s.appendChild(document.createTextNode(e[1])); legend.appendChild(s);
    });
    top.appendChild(legend);
    board.appendChild(top);

    // ---- Gelb + Blau side by side, like on the pad ----
    var duo = document.createElement('div'); duo.className = 'gsc-duo';

    var Y = def.yellow;
    var yArea = area('gelb', 'Gelb', tot.parts.gelb, null);
    var yGrid = document.createElement('div'); yGrid.className = 'gsc-grid';
    Y.rows.forEach(function(row, r){
      row.forEach(function(v, c){
        var on = sc.yellow[r][c];
        var b = cellBtn(v==='X' ? '' : v, on);
        if(v==='X'){ b.classList.add('pre'); b.disabled = true; b.title = 'Vorgedruckt'; }
        else b.addEventListener('click', function(){ commit(function(){ sc.yellow[r][c] = !sc.yellow[r][c]; }); });
        yGrid.appendChild(b);
      });
      yGrid.appendChild(slot('yr'+r, Y.rowBonus[r]));
    });
    Y.colPoints.forEach(function(p, c){
      yGrid.appendChild(sub(p, sc.yellow.every(function(row){ return row[c]; })));
    });
    yGrid.appendChild(slot('yd', Y.diagBonus));
    yArea.appendChild(yGrid);
    duo.appendChild(yArea);

    var B = def.blue;
    var bArea = area('blau', 'Blau', tot.parts.blau, null);
    var track = document.createElement('div'); track.className = 'gsc-track';
    B.table.forEach(function(p, i){ track.appendChild(sub(p, i===tot.blueCount-1)); });
    bArea.appendChild(track);
    var bGrid = document.createElement('div'); bGrid.className = 'gsc-grid';
    B.rows.forEach(function(row, r){
      row.forEach(function(v){
        if(v===null){
          var d = document.createElement('div'); d.className = 'gsc-cell deco'; d.innerHTML = DUO_ICON;
          d.title = 'Summe aus blauem und weißem Würfel'; bGrid.appendChild(d); return;
        }
        var b = cellBtn(v, sc.blue[v-2]);
        b.addEventListener('click', function(){ commit(function(){ sc.blue[v-2] = !sc.blue[v-2]; }); });
        bGrid.appendChild(b);
      });
      bGrid.appendChild(slot('br'+r, B.rowBonus[r]));
    });
    B.colBonus.forEach(function(spec, c){ bGrid.appendChild(slot('bc'+c, spec)); });
    bArea.appendChild(bGrid);
    duo.appendChild(bArea);
    board.appendChild(duo);

    // ---- Grün: cross left to right, each field needs at least the printed value ----
    var G = def.green;
    var gArea = area('gruen', 'Grün', tot.parts.gruen, 'von links, Würfel ≥ Feldwert');
    var gStrip = document.createElement('div'); gStrip.className = 'gsc-strip';
    G.req.forEach(function(req, i){
      var col = document.createElement('div'); col.className = 'gsc-col';
      var b = cellBtn('≥' + req, sc.green[i]);
      if(i===tot.greenCount) b.classList.add('next');
      b.addEventListener('click', function(){
        if(i===tot.greenCount) commit(function(){ sc.green[i] = true; });
        else if(i===tot.greenCount-1) commit(function(){ sc.green[i] = false; });
        else showToast('Grün wird von links nach rechts angekreuzt');
      });
      col.appendChild(b); col.appendChild(sub(G.table[i], i===tot.greenCount-1)); col.appendChild(slot('g'+i, G.bonus[i]));
      gStrip.appendChild(col);
    });
    gArea.appendChild(gStrip);
    board.appendChild(gArea);

    // ---- Orange / Lila: enter die values left to right via the picker ----
    function valueStrip(key, title, rule, cfg){
      var arr = sc[key], filled = arr.filter(function(v){ return v!==null; }).length;
      var el = area(key, title, tot.parts[key], rule);
      var strip = document.createElement('div'); strip.className = 'gsc-strip';
      arr.forEach(function(v, i){
        var mult = cfg.mult ? cfg.mult[i] : 1;
        var col = document.createElement('div'); col.className = 'gsc-col';
        var b = document.createElement('button'); b.className = 'gsc-cell' + (v===null ? ' empty' : '') + (i===filled ? ' next' : '');
        b.textContent = v===null ? '' : v*mult;
        b.addEventListener('click', function(){
          if(i > filled){ showToast('Bitte der Reihe nach von links eintragen'); return; }
          if(i < filled-1){ showToast('Nur das letzte Feld lässt sich ändern'); return; }
          var prev = i > 0 ? arr[i-1] : null;
          var strict = key==='lila' && prev!==null && prev!==6;
          openDiePicker(title + ' · Feld ' + (i+1),
            (mult > 1 ? 'Würfelwert wählen, zählt ×' + mult + '. ' : 'Würfelwert wählen. ') + (strict ? 'Muss größer als ' + prev + ' sein.' : ''),
            function(d){ return !strict || d > prev; },
            i===filled-1 ? { label:'Feld leeren', fn:function(){ commit(function(){ arr[i] = null; }); } } : null,
            function(d){ commit(function(){ arr[i] = d; }); });
        });
        col.appendChild(b); col.appendChild(sub(mult > 1 ? '×' + mult : '', false)); col.appendChild(slot(key.charAt(0)+i, cfg.bonus[i]));
        strip.appendChild(col);
      });
      el.appendChild(strip);
      return el;
    }
    board.appendChild(valueStrip('orange', 'Orange', 'Würfelwert, ×2/×3 zählt doppelt/dreifach', def.orange));
    board.appendChild(valueStrip('lila', 'Lila', 'jede Zahl größer als die davor, nach 6 frei', def.lila));

    // ---- bottom summary, like the score row on the pad ----
    var sumArea = area(null, 'Wertung', null, null);
    var sum = document.createElement('div'); sum.className = 'gsc-sum';
    def.sections.forEach(function(s, i){
      if(i) sum.insertAdjacentHTML('beforeend', '<span class="op">+</span>');
      var box = document.createElement('span'); box.className = 'box'; box.style.setProperty('--a', s.color); box.textContent = tot.parts[s.key]; box.title = s.label;
      sum.appendChild(box);
    });
    sum.insertAdjacentHTML('beforeend', '<span class="op">+</span>');
    var fox = document.createElement('span'); fox.className = 'fox';
    fox.appendChild(gscChip(def, {kind:'fox'}, true));
    fox.appendChild(document.createTextNode(tot.fox + '×' + tot.foxMin));
    fox.title = 'Füchse × schwächster Bereich = ' + tot.foxScore;
    sum.appendChild(fox);
    sum.insertAdjacentHTML('beforeend', '<span class="op">=</span><span class="box total">' + tot.grand + '</span>');
    sumArea.appendChild(sum);
    board.appendChild(sumArea);

    sheetView.appendChild(board);
    bbTotal.textContent = tot.grand;
  }

  // ---------- dispatch ----------
  function renderSheet(){
    sheetView.innerHTML = '';
    var def = GAMES[state.game], player = state.players[state.activePlayerIndex];
    if(!player) return;
    var sc = player.scores;
    if(def.layout==='gsc') renderGscSheet(def, player, sc);
    else if(def.family==='kniffel') renderKniffelSheet(def, player, sc);
    else if(def.family==='qwixx') renderQwixxSheet(def, player, sc);
    else if(def.family==='clever') renderCleverSheet(def, player, sc);
  }

  function renderRankList(){
    var rows = state.players.map(function(p){ return { name:p.name, total:getGrandTotal(p, state.game) }; });
    rows.sort(function(a,b){ return b.total - a.total; });
    var maxTotal = rows.length ? rows[0].total : 0;
    rankList.innerHTML = '';
    rows.forEach(function(r,i){
      var el = document.createElement('div');
      el.className = 'rank-row' + (r.total===maxTotal && maxTotal>0 && rows.length>1 ? ' lead' : '');
      el.innerHTML = '<span class="r">'+(i+1)+'.</span><span class="n">'+escapeHtml(r.name)+'</span><span class="t">'+r.total+'</span>';
      rankList.appendChild(el);
    });
  }
  closeOverlay.addEventListener('click', function(){ overlay.classList.remove('open'); });
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.classList.remove('open'); });

  function goNewGame(){
    if(!confirm('Neues Spiel starten? Die aktuellen Punktestände werden gelöscht.')) return;
    state.setupNames = state.players.map(function(p){ return p.name; });
    state.players = []; state.gscRound = 1; state.tray = emptyTray(); state.phase = 'setup'; save(); renderAll();
  }

  function renderBottomActions(){
    bbActions.innerHTML = '';
    if(GAMES[state.game].turnMode==='roundrobin' && state.players.length>1){
      var nextIdx = (state.activePlayerIndex+1) % state.players.length;
      var nextBtn = document.createElement('button'); nextBtn.className = 'next-btn';
      nextBtn.textContent = 'Weiter → ' + state.players[nextIdx].name;
      nextBtn.addEventListener('click', function(){ advanceRoundRobin(); save(); renderAll(); });
      bbActions.appendChild(nextBtn);
    }
    var ov = document.createElement('button'); ov.className = 'ghost-btn'; ov.textContent = 'Übersicht';
    ov.addEventListener('click', function(){ renderRankList(); overlay.classList.add('open'); });
    bbActions.appendChild(ov);
    var ng = document.createElement('button'); ng.className = 'ghost-btn'; ng.textContent = 'Neues Spiel';
    ng.addEventListener('click', goNewGame);
    bbActions.appendChild(ng);
  }

  // ===================================================================
  // Master render
  // ===================================================================
  function renderAll(){
    applyTheme();
    backBtn.classList.toggle('hidden', state.phase==='picker');
    pickerView.classList.toggle('hidden', state.phase!=='picker');
    setupView.classList.toggle('hidden', state.phase!=='setup');
    sheetView.classList.toggle('hidden', state.phase!=='game');
    bottomBar.classList.toggle('hidden', state.phase!=='game');
    playerTabsEl.classList.toggle('hidden', state.phase!=='game');

    if(state.phase==='picker'){
      brandName.textContent = 'Würfelpad';
      renderPicker();
    } else {
      var def = GAMES[state.game];
      brandName.textContent = def.label;
      if(state.phase==='setup'){
        setupTitle.textContent = 'Wer spielt ' + def.label + '?';
        rulesetNote.innerHTML = RULESET_NOTES[state.game];
        renderSetupRows();
        updateStartBtn();
      } else if(state.phase==='game'){
        renderPlayerTabs();
        renderSheet();
        renderBottomActions();
      }
    }
    syncWakeLock();
  }

  // keep the iPhone screen on while a game is open (Safari 16.4+), released on picker/setup or in background
  var wakeLock = null;
  function syncWakeLock(){
    if(!('wakeLock' in navigator)) return;
    var want = state.phase==='game' && document.visibilityState==='visible';
    if(want && !wakeLock){
      wakeLock = 'pending';
      navigator.wakeLock.request('screen').then(function(l){
        wakeLock = l; l.addEventListener('release', function(){ wakeLock = null; });
      }).catch(function(){ wakeLock = null; });
    } else if(!want && wakeLock && wakeLock !== 'pending'){
      wakeLock.release(); wakeLock = null;
    }
  }
  document.addEventListener('visibilitychange', syncWakeLock);

  load();
  if(!state.players) state.players = [];
  if(!state.setupNames || !state.setupNames.length) state.setupNames = ['',''];
  if(state.phase==='game' && (!state.players.length || !state.game)) state.phase = state.game ? 'setup' : 'picker';
  if(state.phase==='setup' && !state.game) state.phase = 'picker';
  // saved games from the old generic Clever layout don't fit the pad layout — start those sheets fresh
  if(state.game && GAMES[state.game].layout==='gsc'){
    state.players.forEach(function(p){ if(!p.scores || p.scores.v!==2) p.scores = freshScoresFor(state.game); });
    if(!state.gscRound) state.gscRound = 1;
  }
  renderAll();
})();
</script>
